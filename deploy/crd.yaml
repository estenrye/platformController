                  so a CR left over from v0.1.11 still deserializes; validation rejects it.
                type: string
              platformKind:
                enum:
                - talos-linux
                type: string
              rewrite:
                default: Disabled
                description: |-
                  `Disabled` (default) only observes. `Enabled` lets the controller
                  rewrite every Secret once the apiserver writes with the target provider.
                enum:
                - Disabled
                - Enabled
                type: string
            required:
            - platformKind
            type: object
          status:
            nullable: true
            properties:
              conditions:
                default: []
                items:
                  properties:
                    lastTransitionTime:
                      type: string
                    message:
                      type: string
                    observedGeneration:
                      format: int64
                      nullable: true
                      type: integer
                    reason:
                      type: string
                    status:
                      type: string
                    type:
