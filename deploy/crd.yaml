apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cniinstallations.platform.rye.ninja
spec:
  group: platform.rye.ninja
  names:
    kind: CniInstallation
    plural: cniinstallations
    shortNames:
    - cni
    singular: cniinstallation
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for CniInstallationSpec via `CustomResource`
        properties:
          spec:
            properties:
              calico:
                properties:
                  apiServerEnabled:
                    default: false
                    type: boolean
                  bgp:
                    description: 'BGP configuration and peers. Requires `bgpEnabled: true`.'
                    nullable: true
                    properties:
                      asNumber:
                        format: uint32
                        minimum: 0.0
                        type: integer
                      logSeverityScreen:
                        default: Info
                        enum:
                        - Debug
                        - Info
                        - Warning
                        - Error
                        - Fatal
                        type: string
                      nodeToNodeMeshEnabled:
                        default: true
                        type: boolean
                      peers:
                        default: []
                        items:
                          properties:
                            asNumber:
                              format: uint32
                              minimum: 0.0
                              type: integer
                            name:
                              type: string
                            peerIP:
                              type: string
                          required:
                          - asNumber
                          - name
                          - peerIP
                          type: object
                        type: array
                      serviceLoadBalancerIPs:
                        default: []
                        description: CIDRs of LoadBalancer VIP pools to advertise to BGP peers.
                        items:
                          type: string
                        type: array
                    required:
                    - asNumber
                    type: object
                  bgpEnabled:
                    default: false
                    type: boolean
                  chartVersion:
                    type: string
                  ipPools:
                    default: []
                    items:
                      properties:
                        blockSize:
                          description: |-
                            Omitted means "use Calico's default for this pool's address family",
                            resolved at render time (26 for IPv4, 122 for IPv6) because a single
                            fixed serde default cannot be right for both families.
                          format: int32
                          nullable: true
                          type: integer
                        cidr:
                          type: string
                        disabled:
                          default: false
                          description: |-
                            Retired pools stay declared with `disabled: true`: Calico's pool CIDR is
                            immutable, so renumbering is a new-pool swap, not an in-place edit. A
                            disabled pool is rendered as a disabled `IPPool` but kept out of the
                            `Installation`, which would otherwise recreate it as enabled.
                          type: boolean
                        encapsulation:
                          default: None
                          enum:
                          - IPIP
                          - VXLAN
                          - None
                          type: string
                        name:
                          type: string
                        natOutgoing:
                          default: true
                          type: boolean
                        nodeSelector:
                          default: all()
                          type: string
                      required:
                      - cidr
                      - name
                      type: object
                    type: array
                  loadBalancerPools:
                    default: []
                    description: LoadBalancer-only IP pools (native Calico LoadBalancer IPAM, Calico >= 3.30).
                    items:
                      properties:
                        cidr:
                          type: string
                        disabled:
                          default: false
                          description: |-
                            Retired pools stay declared with `disabled: true`: Calico's pool CIDR is
                            immutable, so renumbering is a new-pool swap, not an in-place edit.
                          type: boolean
                        name:
                          type: string
                        nodeSelector:
                          default: all()
                          type: string
                      required:
                      - cidr
                      - name
                      type: object
                    type: array
                  nodeAddressAutodetectionV6Cidrs:
                    default: []
                    description: |-
                      IPv6 CIDRs whose addresses Calico may use as a node's address. Only
                      used with the `cidrs` method; the `/64` you list must carry nothing
                      else (no SLAAC addresses, no floating VIP), or Calico can pick the wrong
                      address.
                    items:
                      type: string
                    type: array
                  nodeAddressAutodetectionV6Method:
                    default: cidrs
                    description: |-
                      How Calico detects a node's IPv6 address. `cidrs` (the default) uses
                      `nodeAddressAutodetectionV6Cidrs`; `kubernetesInternalIP` uses each
                      node's Kubernetes InternalIP and cannot be combined with a CIDR list.
                    enum:
                    - cidrs
                    - kubernetesInternalIP
                    type: string
                required:
                - chartVersion
                type: object
              cleanupTimeoutSeconds:
                default: 60
                description: |-
                  How long to wait, during cleanup, for the CNI provider's own managed
                  resources (e.g. Calico's `calico-node` DaemonSet) to actually disappear
                  before this controller removes the provider's operator itself. Not
                  nested under `calico`: any future provider's cleanup would need the
                  same kind of bounded wait.
                format: uint32
                minimum: 0.0
                type: integer
              platformKind:
                enum:
                - talos-linux
                type: string
              provider:
                enum:
                - calico
                type: string
            required:
            - calico
            - platformKind
            - provider
            type: object
          status:
            nullable: true
            properties:
              appliedResources:
                default: []
                items:
                  properties:
                    apiVersion:
                      type: string
                    kind:
                      type: string
                    name:
                      type: string
                    namespace:
                      default: ''
                      type: string
                  required:
                  - apiVersion
                  - kind
                  - name
                  type: object
                type: array
              chartVersion:
                default: ''
                type: string
              conditions:
                default: []
                items:
                  properties:
                    lastTransitionTime:
                      type: string
                    message:
                      type: string
                    observedGeneration:
                      format: int64
                      nullable: true
                      type: integer
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                default: 0
                format: int64
                type: integer
              phase:
                default: Pending
                enum:
                - Pending
                - Installing
                - Ready
                - Failed
                type: string
            type: object
        required:
        - spec
        title: CniInstallation
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
