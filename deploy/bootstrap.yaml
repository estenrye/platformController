apiVersion: v1
kind: Namespace
metadata:
  name: platform-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-controller
  namespace: platform-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: platform-controller
subjects:
  - kind: ServiceAccount
    name: platform-controller
    namespace: platform-system
# The controller renders the tigera-operator chart and server-side-applies every
# object in it, including the operator's own ClusterRole. Kubernetes refuses a
# Role/ClusterRole create unless the actor already holds every permission being
# granted, so a hand-maintained rule list would have to mirror Calico's chart
# exactly and be updated on every chart bump. Binding cluster-admin is the
# spec's explicitly-accepted MVP trade-off.
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-controller
  namespace: platform-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: platform-controller
  template:
    metadata:
      labels:
        app: platform-controller
    spec:
      serviceAccountName: platform-controller
      hostNetwork: true
      # Default, not ClusterFirstWithHostNet: this controller runs *before* a CNI
      # exists, so cluster DNS (coredns) cannot be running yet. Pointing at the
      # cluster DNS service IP makes the helm chart-repo lookup fail forever
      # ("lookup projectcalico.docs.tigera.io on 10.96.0.10:53"). Default
      # inherits the node's resolv.conf, which works with no pod network.
      dnsPolicy: Default
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoSchedule
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      # Preferred, not required: a small dev/test cluster may only have one or
      # two control-plane nodes, and a hard requirement could leave a replica
      # permanently unschedulable.
      #
      # Consequence on a single control-plane node (e.g. this project's own
      # Talos-in-Docker test recipe, `talosctl cluster create --workers 1`):
      # both replicas co-locate, and the PodDisruptionBudget below
      # (maxUnavailable: 1) will then PERMANENTLY BLOCK a `kubectl drain` or
      # node upgrade of that node. The first eviction succeeds; the second is
      # refused forever, since evicting it would leave 0 healthy replicas
      # against a budget requiring at least 1. Before draining a
      # single-control-plane-node cluster, either drop the PDB temporarily
      # (`kubectl delete pdb -n platform-system platform-controller`) or use
      # `kubectl drain --disable-eviction`.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: platform-controller
      containers:
        - name: platform-controller
          image: estenrye/platform-controller:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: RUST_LOG
              value: info
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: platform-controller
  namespace: platform-system
# Gates the Eviction API only (node drains, autoscaler scale-down) — NOT this
# Deployment's own rollout, which is governed solely by its
# strategy.rollingUpdate defaults (25% maxUnavailable -> 0, 25% maxSurge -> 1 at
# 2 replicas, i.e. surge-then-replace). See the drain-deadlock warning on the
# pod anti-affinity above before draining a single-control-plane-node cluster.
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: platform-controller
