apiVersion: v1
kind: Namespace
metadata:
  name: platform-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-controller
  namespace: platform-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: platform-controller
subjects:
  - kind: ServiceAccount
    name: platform-controller
    namespace: platform-system
# The controller renders the tigera-operator chart and server-side-applies every
# object in it, including the operator's own ClusterRole. Kubernetes refuses a
# Role/ClusterRole create unless the actor already holds every permission being
# granted, so a hand-maintained rule list would have to mirror Calico's chart
# exactly and be updated on every chart bump. Binding cluster-admin is the
# spec's explicitly-accepted MVP trade-off.
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-controller
  namespace: platform-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platform-controller
  template:
    metadata:
      labels:
        app: platform-controller
    spec:
      serviceAccountName: platform-controller
      hostNetwork: true
      # Default, not ClusterFirstWithHostNet: this controller runs *before* a CNI
      # exists, so cluster DNS (coredns) cannot be running yet. Pointing at the
      # cluster DNS service IP makes the helm chart-repo lookup fail forever
      # ("lookup projectcalico.docs.tigera.io on 10.96.0.10:53"). Default
      # inherits the node's resolv.conf, which works with no pod network.
      dnsPolicy: Default
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoSchedule
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      containers:
        - name: platform-controller
          image: platform-controller:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: RUST_LOG
              value: info
---
apiVersion: platform.rye.ninja/v1alpha1
kind: CniInstallation
metadata:
  name: default
spec:
  platformKind: talos-linux
  provider: calico
  calico:
    chartVersion: v3.29.1
    bgpEnabled: false
    apiServerEnabled: false
    ipPools:
      - name: default
        cidr: 10.244.0.0/16
        encapsulation: VXLAN
        natOutgoing: true
        # Valid IPv4 blockSize range is 20-32; 26 is the operator's documented default.
        blockSize: 26
