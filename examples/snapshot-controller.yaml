# Sample SnapshotController for a self-hosted Talos Linux cluster: installs
# the cluster-wide CSI VolumeSnapshot support (the snapshot.storage.k8s.io
# CRDs and the snapshot-controller itself) that CsiDriver's own
# csi-snapshotter sidecar needs to actually produce a VolumeSnapshot. Without
# this, the sidecar runs but every snapshot attempt just retries forever
# against CRDs that don't exist yet.
#
#   kubectl apply -f examples/snapshot-controller.yaml
apiVersion: platform.rye.ninja/v1alpha1
kind: SnapshotController
metadata:
  name: default
spec:
  platformKind: talos-linux
  # The Helm CHART version, not the app version (v8.6.0 at this chart
  # version) -- chart and app versions do not track together here, unlike
  # cert-manager.
  chartVersion: "5.3.0"
  # Leave this false (the default) on OpenStack: cinder-csi-plugin has never
  # implemented the CSI group-snapshot RPCs (confirmed by searching its own
  # source, 2026-09-29), and live-testing with this forced on found the
  # conversion webhook itself actively erroring on every attempt rather than
  # sitting idle. Only set to true for a platform/driver that genuinely
  # implements group snapshots -- doing so also creates a self-signed
  # cert-manager Issuer, which then needs CertManagerInstallation applied and
  # Ready first (see docs/runbooks/snapshot-controller-verification.md).
  groupSnapshotsEnabled: false
